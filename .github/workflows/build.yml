name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release v<pubspec version> with the built APKs'
        type: boolean
        default: false
      prerelease:
        description: 'Mark that release as a pre-release'
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish_release:
        type: boolean
        default: false
      prerelease:
        type: boolean
        default: false
      ref:
        description: 'Ref to build; defaults to the caller commit'
        type: string
        default: ''

# A publishing run gets its own group so an unrelated push to master cannot
# cancel it.
permissions:
  contents: read

concurrency:
  group: build-${{ inputs.ref || github.ref }}-${{ inputs.publish_release || startsWith(github.ref, 'refs/tags/v') }}
  cancel-in-progress: ${{ !inputs.publish_release && !startsWith(github.ref, 'refs/tags/v') }}

env:
  GH_REPO: ${{ github.repository }}
  FLUTTER_VERSION: '3.41.9'
  NDK_VERSION: '28.2.13676358'
  CMAKE_VERSION: '3.22.1'

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Record the tested source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # pubspec declares assets/binaries/ (gitignored); the bundler needs the
      # directory to exist, but analyze/test do not need the real geodata.
      - name: Create placeholder asset directory
        run: mkdir -p assets/binaries && touch assets/binaries/.gitkeep

      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  build:
    name: Release APK
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only a flag lives in the job environment — the keystore itself is passed
    # to the single step that writes it, so no other step or action sees it.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.analyze.outputs.source_sha }}

      - name: Resolve version and release mode
        id: meta
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | cut -d' ' -f2 | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "${TAG#v}" != "$VERSION" ]]; then
              echo "::error::Tag $TAG does not match pubspec version $VERSION"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            if [[ "$TAG" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "${{ inputs.publish_release }}" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # A release signed with debug keys cannot be installed over an existing
      # install and would break the in-app updater, so refuse to publish one.
      - name: Require the release keystore for published builds
        if: steps.meta.outputs.publish == 'true' && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — cannot publish a signed release."
          exit 1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Resolve pinned teapod-core release
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(tr -d '\r\n' < .github/teapod-core-version.txt)
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid pinned teapod-core release: $TAG"
            exit 1
          fi
          gh release view "$TAG" -R Wendor/teapod-core > /dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Cache teapod-core AAR
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: android/app/libs/teapod-core.aar
          key: teapod-core-${{ steps.core.outputs.tag }}

      # Fat AAR only: teapod-core-<version>.aar, not the per-ABI variants.
      - name: Download teapod-core AAR
        id: aar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -s android/app/libs/teapod-core.aar ]]; then
            mkdir -p android/app/libs
            gh release download "${{ steps.core.outputs.tag }}" -R Wendor/teapod-core \
              --pattern 'teapod-core-[0-9]*.aar' \
              --output android/app/libs/teapod-core.aar --clobber
          fi
          ls -lh android/app/libs/teapod-core.aar
          echo "sha256=$(sha256sum android/app/libs/teapod-core.aar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Download geodata
        run: |
          mkdir -p assets/binaries
          BASE=https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download
          curl -fL --retry 3 -o assets/binaries/geoip.dat   "$BASE/geoip.dat"
          curl -fL --retry 3 -o assets/binaries/geosite.dat "$BASE/geosite.dat"
          ls -lh assets/binaries

      - name: Configure release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # The alias is not a secret, and keeping it in one made Actions mask
          # every occurrence of that word in the logs — including the APK names.
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Warn about debug signing
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::No release keystore secret — the APKs will be signed with the Android debug key."

      - run: flutter pub get --enforce-lockfile

      - name: Build release APKs
        run: |
          flutter build apk --release --split-per-abi --no-pub \
            --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Test Android connection and notification policies
        working-directory: android
        run: ./gradlew :app:testReleaseUnitTest

      # Asset names carry no version so that
      # /releases/latest/download/teapod-stream-<abi>.apk stays a permanent
      # link. The version lives in the tag, the release title and versionName.
      - name: Rename APKs
        run: |
          DIR=build/app/outputs/flutter-apk
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            SRC="$DIR/app-$ABI-release.apk"
            if [[ -f "$SRC" ]]; then
              mv "$SRC" "$DIR/teapod-stream-$ABI.apk"
            fi
          done
          ls -lh "$DIR"

      - name: Verify APK versions, signatures and bundled assets
        run: |
          FLAGS=()
          if [[ "$HAS_KEYSTORE" == 'true' ]]; then
            FLAGS+=(--require-release-signature)
          fi
          python3 tools/verify_release_apks.py --source-sha "$(git rev-parse HEAD)" "${FLAGS[@]}"

      # Release APKs are obfuscated, so a crash from a published build is only
      # readable with these symbols — artifacts expire, releases do not.
      - name: Package debug symbols
        id: symbols
        run: |
          DIR=build/app/outputs/symbols
          if [[ -d "$DIR" ]]; then
            ZIP="$PWD/build/app/outputs/teapod-stream-symbols-${{ steps.meta.outputs.version }}.zip"
            (cd "$DIR" && zip -qr "$ZIP" .)
            echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
            ls -lh "$ZIP"
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: teapod-stream-${{ steps.meta.outputs.version }}-apk
          path: |
            build/app/outputs/flutter-apk/teapod-stream-*.apk
            build/app/outputs/flutter-apk/release-manifest.json
            build/app/outputs/flutter-apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Upload debug symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: teapod-stream-${{ steps.meta.outputs.version }}-symbols
          path: build/app/outputs/symbols
          if-no-files-found: warn
          retention-days: 90

      - name: Publish GitHub Release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          SOURCE_SHA=$(git rev-parse HEAD)
          # Reusable workflows retain the caller's GITHUB_SHA. The release
          # must point at the checked out and tested commit instead.
          if [[ -n "$(git ls-remote origin "refs/tags/$TAG")" ]]; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            if [[ "$(git rev-parse "$TAG^{commit}")" != "$SOURCE_SHA" ]]; then
              echo "::error::Release tag $TAG does not point at the built source"
              exit 1
            fi
          fi
          ASSETS=(build/app/outputs/flutter-apk/release-manifest.json build/app/outputs/flutter-apk/SHA256SUMS)
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            APK="build/app/outputs/flutter-apk/teapod-stream-$ABI.apk"
            if [[ -f "$APK" ]]; then
              ASSETS+=("$APK")
            fi
          done
          SYMBOLS="${{ steps.symbols.outputs.zip }}"
          if [[ -n "$SYMBOLS" && -f "$SYMBOLS" ]]; then
            ASSETS+=("$SYMBOLS")
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            FLAGS=(--title "TeapodStream Nordic $VERSION" --generate-notes --target "$SOURCE_SHA")
            # --notes is prepended to the generated notes. The core is a
            # prebuilt binary pulled at build time, so pin down which one this
            # release actually shipped.
            FLAGS+=(--notes "Ядро teapod-core \`${{ steps.core.outputs.tag }}\`, sha256 \`${{ steps.aar.outputs.sha256 }}\`.")
            if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" "${FLAGS[@]}" "${ASSETS[@]}"
          fi

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/release.jks"
