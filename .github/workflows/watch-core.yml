name: Watch teapod-core

# teapod-core ships as a prebuilt AAR pinned by teapod-core-version.txt,
# so a new core never reaches users on its own. This watcher bumps the
# patch version and publishes a release whenever the core moves.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: watch-core
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  check:
    name: Check for a new core
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      core: ${{ steps.check.outputs.core }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master

      - name: Compare the released core against the recorded one
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE=.github/teapod-core-version.txt
          CORE=$(gh release view -R Wendor/teapod-core --json tagName -q .tagName)
          # A pinned dependency is NOT proof of successful publication. Read
          # the manifest from the latest public release, so failed attempts retry.
          MANIFEST=$(mktemp -d)
          trap 'rm -rf "$MANIFEST"' EXIT
          gh release download --pattern release-manifest.json --dir "$MANIFEST"
          PREV=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["teapod_core"])' "$MANIFEST/release-manifest.json")
          echo "core=$CORE" >> "$GITHUB_OUTPUT"
          echo "upstream core: $CORE, last published core: $PREV"
          if [[ "$PREV" == "$CORE" ]]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          VERSION=$(grep '^version:' pubspec.yaml | head -1 | cut -d' ' -f2 | cut -d'+' -f1)
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          # versionCode follows the existing scheme: major*10000 + minor*100 +
          # patch, so the patch has to stay below 100.
          if (( PATCH >= 99 )); then
            echo "::error::Patch $VERSION is at the limit of the versionCode scheme — bump the minor by hand."
            exit 1
          fi
          PATCH=$(( PATCH + 1 ))
          NEW="$MAJOR.$MINOR.$PATCH"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))

          sed -i "s/^version: .*/version: $NEW+$CODE/" pubspec.yaml
          echo "$CORE" > "$STATE"
          git add pubspec.yaml "$STATE"
          git commit -m "chore: release $NEW with teapod-core $CORE"
          # Do not expose a tag before verification. Never move an existing tag.
          EXISTING_TAG=$(git ls-remote origin "refs/tags/v$NEW")
          if [[ -n "$EXISTING_TAG" ]]; then
            echo "::error::Tag v$NEW already exists; recovery requires a newer version."
            exit 1
          fi
          git push origin HEAD:master

          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "tag=refs/tags/v$NEW" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "::notice::teapod-core $CORE -> releasing $NEW"

  # Build the exact candidate directly; no tag exists until publication.
  release:
    name: Build and publish
    needs: check
    if: needs.check.outputs.bumped == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      publish_release: true
      ref: ${{ needs.check.outputs.commit }}
    secrets: inherit

  # Restore only our untouched tip, never rewrite history or remove tags.
  # Reporting is independent: disabled Issues cannot prevent recovery.
  rollback:
    name: Roll back the failed release
    needs: [check, release]
    if: always() && needs.check.outputs.bumped == 'true' && needs.release.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0

      - name: Restore the unpublished bump safely
        env:
          CANDIDATE: ${{ needs.check.outputs.commit }}
          VERSION: ${{ needs.check.outputs.version }}
        run: bash tools/rollback_release.sh

      - name: Report the actual recovery result
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "Release failed. See recovery step for its actual outcome: $RUN_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "A later check compares the published manifest, not the pinned dependency." >> "$GITHUB_STEP_SUMMARY"
