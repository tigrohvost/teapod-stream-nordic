name: Watch teapod-core
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: watch-core
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record candidate for review (never promote automatically)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Wendor/teapod-core/releases/latest > candidate-core.json
          python3 tools/core_candidate.py candidate-core.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-candidate
          path: candidate-dependencies.lock.json
          if-no-files-found: ignore
